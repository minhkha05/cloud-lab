services:
  backend:
    build:
      context: ./mern-demo
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}

  frontend:
    build:
      context: ./mern-demo/client
    ports:
      - "4173:4173"
    depends_on:
      - backend

networks:
  default:
    name: mern-network
    external: true